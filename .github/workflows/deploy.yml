name: Deploy

# Push to `main`  -> production  (api.hub.borderlessunn.xyz)
# Push to `dev`   -> staging      (api.test.hub.borderlessunn.xyz)
on:
  push:
    branches: [main, dev]

# Never run two deploys for the same branch at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target from branch
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
            echo "dir=/var/www/borderless-hub-app-backend-prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
            echo "dir=/var/www/borderless-hub-app-backend-test" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            sudo ${{ steps.env.outputs.dir }}/deploy/deploy.sh ${{ steps.env.outputs.target }}
